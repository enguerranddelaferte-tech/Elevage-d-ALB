<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout : une colonne d'appli mobile (max 640px), en-tête collant, barre d'onglets fixée en bas */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#E9ECE6; --fg:#1C2420; --muted:#56605A; --line:#DFE3DC;
  --accent:#2F5D46; --accent-ink:#1F4232; --accent-soft:#E2ECE5; --on-accent:#FFFFFF;
  --warn-bg:#FBF1DE; --warn-fg:#6F470D; --danger:#9A3B2A; --danger-soft:#F6E3DE; --overlay:rgba(20,26,23,.45);
  --f-display:'Outfit',ui-sans-serif,system-ui,sans-serif; --f-body:'DM Sans',ui-sans-serif,system-ui,sans-serif;
  --r:14px;--c1:#2B7D4F;--c2:#C0781A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A211E; --surface-2:#232B27; --fg:#E6ECE8; --muted:#A2ADA6; --line:#2D3732;
  --accent:#7DB894; --accent-ink:#A9D4B8; --accent-soft:#1F3128; --on-accent:#0D1511;
  --warn-bg:#33281A; --warn-fg:#F0C27B; --danger:#F08A75; --danger-soft:#3A2420; --overlay:rgba(0,0,0,.6); --c1:#3C9A66; --c2:#CC7A1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A211E; --surface-2:#232B27; --fg:#E6ECE8; --muted:#A2ADA6; --line:#2D3732;
  --accent:#7DB894; --accent-ink:#A9D4B8; --accent-soft:#1F3128; --on-accent:#0D1511;
  --warn-bg:#33281A; --warn-fg:#F0C27B; --danger:#F08A75; --danger-soft:#3A2420; --overlay:rgba(0,0,0,.6); --c1:#3C9A66; --c2:#CC7A1A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
header.top .t{flex:1;min-width:0}
header.top .d{font-size:13px;color:var(--muted)}
header.top h1{font-size:24px;font-weight:700}
main .wrap{padding-block:18px 120px;display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sh h2{font-size:18px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stat.hot span{color:var(--on-accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.alert{display:flex;gap:12px;align-items:center;background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:11px 14px;font-size:14px}
.alert .x{flex:1;min-width:0}
.alert b{color:var(--fg)}
.alert.late{background:var(--danger-soft);color:var(--danger)}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:52px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.items>.item:first-child{border-top:0}
.item .x{flex:1;min-width:0}
.item .x b{display:block;font-size:15px}
.item .x span{font-size:13px;color:var(--muted)}
.item .end{text-align:right;font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.task{cursor:default}
.task input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.task.done .x b{text-decoration:line-through;color:var(--muted)}
.del-x{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:18px;cursor:pointer;flex:none}
.time{font-family:var(--f-display);font-weight:700;font-size:15px;width:52px;flex:none;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;background:var(--surface-2);padding:3px 8px;border-radius:8px}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.day small{font-size:11px;color:var(--muted)}
.day b{font-size:16px;font-variant-numeric:tabular-nums}
.day.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.day.on small{color:var(--bg)}
.day .dot{width:5px;height:5px;border-radius:3px;background:var(--accent);position:absolute;bottom:6px}
.day.on .dot{background:var(--bg)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .sub{flex:1;text-align:center}
.hero{background:var(--fg);color:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .row{display:flex;gap:22px;font-size:13px}
.hero .row b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-size:14px}
.banner .x{flex:1;min-width:180px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.search{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px}
.checks label{display:flex;gap:10px;align-items:center;padding:10px 12px;min-height:44px;border-top:1px solid var(--line);font-weight:500;color:var(--fg);font-size:14px}
.checks label:first-child{border-top:0}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .grow{flex:1}
table.lines{width:100%;border-collapse:collapse;font-size:14px}
table.lines td{padding:9px 0;border-top:1px solid var(--line)}
table.lines td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
table.lines tr.tot td{font-weight:700;font-size:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.modal-wrap{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.modal-wrap{align-items:center}.modal{border-radius:20px;max-height:86%}}
/* Tablette : colonne plus large, sections côte à côte quand la place le permet */
@media (min-width:700px){
  .wrap,nav.tabs .in{max-width:900px}
  #view{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;align-items:start}
  #view>*:not(section){grid-column:1/-1}
  #view>section:only-of-type{grid-column:1/-1}
  .modal{max-width:680px}
  .msgs{max-width:720px}
}
/* Ordinateur : menu latéral à gauche, contenu large */
@media (min-width:1000px){
  :root{--side:236px}
  header.top,main{margin-left:var(--side)}
  .wrap{max-width:1180px}
  #view{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
  nav.tabs{top:0;bottom:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--line);padding:env(safe-area-inset-top,0px) 12px 16px max(12px,env(safe-area-inset-left,0px))}
  nav.tabs .in{flex-direction:column;gap:4px;max-width:none;height:100%}
  nav.tabs .in::before{content:"Élevage d'ALB";font-family:var(--f-display);font-weight:700;font-size:19px;padding:22px 12px 18px;color:var(--fg)}
  nav.tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:12px;font-size:14px;min-height:44px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
  nav.tabs button:hover{background:var(--surface-2)}
  main .wrap{padding-block:24px 48px}
  .toast{bottom:28px;left:calc(50% + var(--side)/2)}
  #hlist .items,.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  #hlist .items>.item:nth-child(2){border-top:0}
  #hlist .items>.item:nth-child(even){border-left:1px solid var(--line)}
  .modal{max-width:760px}
}
.mhead{display:flex;align-items:center;gap:10px}
.mhead h2{flex:1;font-size:21px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.nbadge{position:absolute;top:-6px;right:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:var(--surface);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1}
#hmsg{position:relative}#hmsg .nbadge{top:0;right:0}
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;align-self:flex-start;padding:10px 12px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.bub.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bub small{display:block;font-size:11px;opacity:.8;margin-top:4px}
.chartbox{overflow-x:auto}.chart{position:relative;display:grid;grid-template-columns:repeat(12,minmax(22px,1fr));gap:6px;align-items:end;min-width:320px;padding-left:44px;padding-top:14px}
.chart .gl{position:absolute;left:44px;right:0;border-top:1px dashed var(--line);height:0}.chart .gl span{position:absolute;left:-44px;top:-8px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1}.bcol small{font-size:11px;color:var(--muted);height:14px}
.bpair{display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center}.bar{display:block;width:42%;max-width:14px;border-radius:4px 4px 0 0;min-height:0}
.b1{background:var(--c1)}.b2{background:var(--c2)}.bcol:hover .bar{filter:brightness(1.1)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
details summary{list-style-position:inside}
.warnline{font-size:13px;color:var(--danger);font-weight:500}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

</head>

/* ---------- dates & formats ---------- */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function toD(s){return new Date(s+'T12:00:00')}

var eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});

function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase()}).join('')}
function monthLabel(m){var s=toD(m+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- factures ---------- */
function generate(mois,silent){
  if(readOnly){toast('Accès en lecture seule.');return 0}
  var m=typeof mois==='string'?mois:S.mois,n=0,kept=0,puts=[],drops=[];
  db.proprietaires.forEach(function(p){
    var ex=db.factures.find(function(f){return f.mois===m&&f.proprietaireId===p.id&&!isAvoir(f)});
    if(ex&&(ex.statut==='payee'||ex.envoyeeLe)){kept++;return}
    var lignes=[];
    db.chevaux.filter(function(c){return c.proprietaireId===p.id}).forEach(function(c){var pr=presence(c,m);if(!pr.jours)return;var t=+db.tarifs[c.pension]||0;

  if(id==='ftarifs'){['complete','pre','demi','collectif','particulier'].forEach(function(k){db.tarifs[k]=+v('t-'+k)||0});db.annulHeures=Math.max(0,+v('t-annul')||0);var li=v('t-lieux').split('\n').map(function(x){return x.trim()}).filter(Boolean);db.lieux=li.length?li:LIEUX_DEF.slice();putConfig();toast('Réglages enregistrés');render();return}
  if(!M)return;M.read();var d=M.draft;
  if(id==='fhorse'){if(!d.nom){toast('Indiquez le nom du cheval.');return}if(!d.proprietaireId){toast('Ajoutez d\'abord un propriétaire.');return}}

  if(id==='fcours'){if(!d.titre){M.err='Indiquez un intitulé pour le cours.';M.render();return}if(d.inscrits.length>d.places){M.err=d.inscrits.length+' inscrits pour '+d.places+' place'+(d.places>1?'s':'')+' : augmentez le nombre de places ou retirez un cavalier.';M.render();return}}
  delete M.err;var k=M.kind;
  if(d.id){var i=db[k].findIndex(function(x){return x.id===d.id});db[k][i]=d}else{d.id=uid();db[k].push(d)}
  if(k==='cours')S.coursDate=d.date;
  put(k,d);closeModal();render();toast('Enregistré');if(k==='chevaux')cleanupPieces();
});

  document.head.appendChild(lib)}
else startLocal();

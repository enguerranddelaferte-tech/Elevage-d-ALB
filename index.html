.mcell b{font-size:15px}.mcell small{font-size:10px;line-height:1.1;color:var(--accent);font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}.mcell small.ann{color:var(--danger)}
.mcell.empty{border:0;background:none;cursor:default}.mcell.today{border-color:var(--accent)}.mcell.mine{background:var(--accent-soft)}.mcell.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}.mcell.on small{color:var(--surface)}

.pres{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip.ok{background:var(--accent-soft);color:var(--accent-ink)}.chip.no{background:var(--danger-soft);color:var(--danger);text-decoration:line-through}

function cacheKey(){return KEY+'-cloud-'+(me.uid||'')}
async function startCloud(){
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){authState='login';authView='newpass';render()}});
  var s=null;try{s=(await sb.auth.getSession()).data.session}catch(e){}
  if(authView==='newpass')return;
  if(s){
    /* Affichage immédiat des dernières données gardées sur l'appareil, pendant la vérification en ligne. */
    try{var c0=JSON.parse(localStorage.getItem(KEY+'-cloud-'+s.user.id)||'null');if(c0&&c0.me&&c0.db){me=c0.me;db=c0.db;normalize();authState='ok';fixTab();renderNav();render()}}catch(e){}
    /* Compte supprimé ou session révoquée (ex. base remise à zéro) : on oublie la session et les données gardées sur l'appareil. */
    var gu=null;try{gu=await sb.auth.getUser()}catch(e){}
    if(gu&&gu.error&&!/fetch|network/i.test(gu.error.message||'')){try{await sb.auth.signOut({scope:'local'})}catch(e){}
      try{Object.keys(localStorage).forEach(function(k){if(k.indexOf(KEY+'-cloud-')===0)localStorage.removeItem(k)})}catch(e){}s=null;me={role:'gerant',prop:null,email:'',uid:null};db=emptyDb();normalize()}
  }
  if(!s){authState='login';renderNav();render();return}
  await afterLogin(s);
}
async function afterLogin(s){
  me.email=s.user.email||'';me.uid=s.user.id;
  var r;try{r=await sb.rpc('mon_profil')}catch(e){r={error:e}}
  if(r.error){
    try{var c=JSON.parse(localStorage.getItem(cacheKey())||'null');if(c&&c.me){me=c.me;db=c.db;normalize();authState='ok';loadErr=true;fixTab();renderNav();render();return}}catch(e){}
    authState='login';authMsg='Connexion à la base impossible. Vérifiez votre réseau puis réessayez.';renderNav();render();return}
  if(!r.data){try{localStorage.removeItem(cacheKey())}catch(e){}db=emptyDb();normalize();authState='activate';renderNav();render();return}
  me.role=r.data.role;me.prop=r.data.proprietaire_id;
  var prevUid=null;try{prevUid=localStorage.getItem(KEY+'-lastuid')}catch(e){}if(prevUid!==me.uid){S.tab=(isG()?TABS_G:TABS_C)[0];try{localStorage.setItem(KEY+'-lastuid',me.uid)}catch(e){}}
  try{var c2=JSON.parse(localStorage.getItem(cacheKey())||'null');if(c2&&c2.db){db=c2.db;normalize()}}catch(e){}
  authState='ok';fixTab();renderNav();render();
  await loadAll();
}

  catch(e){loading=false;loadErr=true;refresh();return}

      return o})});
  loadErr=err;db=nd;normalize();loading=false;if(!err)cloudLoaded=true;

  if(/Email not confirmed/i.test(m))return 'Adresse e-mail pas encore confirmée : ouvrez le lien reçu par e-mail.';
  if(/rate limit/i.test(m))return 'Trop de tentatives : réessayez dans quelques minutes.';

function carnetUsage(pid){
  var p=owner(pid),ks=((p&&p.carnets)||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date)}),now=new Date(),res={par:{},cours:{},ks:ks,forfait:{}},ff=forfait(pid),sem={};
  ks.forEach(function(k){res.par[k.id]={passes:0,reserves:0}});
  if(!ks.length&&!ff)return res;
  db.cours.filter(function(c){return !c.annule&&(c.type==='collectif'||c.type==='particulier')&&c.inscrits.indexOf(pid)>-1}).sort(byTime).forEach(function(c){
    /* les premiers cours de chaque semaine sont compris dans la pension, les suivants sont pris sur le carnet */
    if(ff){var w=semaine(c.date);sem[w]=(sem[w]||0)+1;if(sem[w]<=ff){res.forfait[c.id]=1;return}}
    if(!ks.length||c.date<ks[0].date)return;
    var k=ks.find(function(k){var u=res.par[k.id];return k.date<=c.date&&(k.type==='tous'||k.type===c.type)&&u.passes+u.reserves<k.nb+(+k.ajust||0)});
    if(!k)return;res.cours[c.id]=k.id;if(coursStart(c)<now)res.par[k.id].passes++;else res.par[k.id].reserves++});
  return res;
}

  if(cible.type==='proprios'){cible.ids=(cible.ids||[]).filter(Boolean);if(!cible.ids.length)return}

  else if(cible.type==='tous')db.notifs.push(Object.assign({id:uid(),pour:'tous'},base));
  else if(!isG())db.notifs.push(Object.assign({id:uid(),pour:'gerant'},base));

function hashTab(){var h=window.__hashTab;window.__hashTab='';if(!h)return false;try{history.replaceState(history.state,'',location.pathname+location.search)}catch(e){}var ok=isG()?TABS_G.concat(['messages']):TABS_C;if(ok.indexOf(h)>-1){S.tab=h;return true}return false}
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&authState==='ok'){window.__hashTab=h;if(hashTab()){if(M)closeModal(true);render()}}});
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){var d=e.data||{};if(d.type==='notif'&&mode==='cloud')loadAll();
  if(d.type==='goto'&&authState==='ok'){window.__hashTab=d.lien||'';if(hashTab()){if(M)closeModal(true);render();window.scrollTo(0,0)}if(mode==='cloud')loadAll()}});

/* ---------- pensions personnalisées (cours autorisés par semaine) ---------- */
function pensions(){return db.pensions&&db.pensions.length?db.pensions:PENSIONS_DEF}
function pensionOf(id){return pensions().find(function(p){return p.id===id})}
function aLimite(p){return !!p&&p.cours!==''&&p.cours!=null}
function coursSem(n){n=+n;return n===0?'aucun cours':n+' cours par semaine'}
function pensionNom(id){var p=pensionOf(id);return p?p.nom:''}
/* statut d'un cheval : à l'écurie (pas de pension), prêté à l'écurie, ou en pension */
function enPension(c){return !!c.proprietaireId&&c.accueil!=='pret'}
function statutCheval(c){return !c.proprietaireId?'Cheval de l\'écurie':c.accueil==='pret'?'Prêt à l\'écurie':(pensionNom(c.pension)||'Pension')}
/* Forfait d'un cavalier : total des cours par semaine compris dans les pensions de ses chevaux présents (null = pas de limite). */
function forfait(pid){var t=null;actifs().forEach(function(c){if(c.proprietaireId===pid&&enPension(c)){var p=pensionOf(c.pension);if(aLimite(p))t=(t||0)+(+p.cours||0)}
  var a=confDe(c,pid);if(a&&a.cours!==''&&a.cours!=null)t=(t||0)+(+a.cours||0)});return t}
function semaine(d){var x=toD(d);return addDays(d,-((x.getDay()+6)%7))}
function coursSemaine(pid,d){var s=semaine(d),e=addDays(s,6);return db.cours.filter(function(c){return !c.annule&&(c.type==='collectif'||c.type==='particulier')&&c.inscrits.indexOf(pid)>-1&&c.date>=s&&c.date<=e}).length}
function forfaitTxt(pid,d){var ff=forfait(pid);if(ff===null)return '';var n=coursSemaine(pid,d||today());return ff?'Formule : '+coursSem(ff)+' · '+n+' réservé'+(n>1?'s':'')+' cette semaine':'Formule sans cours compris : les cours se prennent avec un carnet'}
function pensionsSettings(){
  var l=pensions(),opts=function(val){return '<option value=""'+(val===''||val==null?' selected':'')+'>Cours non limités</option><option value="0"'+(String(val)==='0'?' selected':'')+'>Aucun cours compris</option>'+[1,2,3,4,5,6,7].map(function(n){return '<option value="'+n+'"'+(String(val)===String(n)?' selected':'')+'>'+n+' cours par semaine</option>'}).join('')};
  return '<div class="form panel" style="padding:14px"><span class="lbl">Pensions</span><div class="panel items">'+l.map(function(p){var nb=actifs().filter(function(c){return enPension(c)&&c.pension===p.id}).length;
    return '<div class="item" style="cursor:default;flex-wrap:wrap"><span class="x" style="flex:1 1 150px"><b>'+esc(p.nom)+'</b><span>'+nb+' cheva'+(nb>1?'ux':'l')+'</span></span><select class="search" name="pn-c" data-id="'+esc(p.id)+'" aria-label="Cours autorisés pour '+esc(p.nom)+'" style="flex:1 1 170px;min-width:0">'+opts(p.cours)+'</select><button type="button" class="del-x" data-act="pension-del" data-id="'+esc(p.id)+'" aria-label="Supprimer '+esc(p.nom)+'">✕</button></div>'}).join('')+
    '<div class="item" style="cursor:default;flex-wrap:wrap"><input class="search" id="pn-nom" placeholder="Nouvelle pension, ex. Pension complète + 2 cours" aria-label="Nom de la nouvelle pension" style="flex:2 1 200px;min-width:0"><select class="search" id="pn-cours" aria-label="Cours autorisés par semaine" style="flex:1 1 170px;min-width:0">'+opts('')+'</select><button type="button" class="btn sm primary" data-act="pension-add">Ajouter</button></div></div>'+
    '<p class="sub" style="margin:0">Les cours autorisés s\'appliquent au propriétaire du cheval. Au-delà, il lui faut un carnet de cours pour réserver.</p></div>';
}

/* ---------- chevaux présents, départ de la structure ---------- */
var MOTIFS_DEPART=['Vente','Retour chez le propriétaire','Changement d\'écurie','Retraite ou repos ailleurs','Prêt ou location','Décès','Autre'];
function parti(c){return !!c.depart&&c.depart<=today()}
function actifs(){return db.chevaux.filter(function(c){return !parti(c)})}
function partis(){return db.chevaux.filter(parti).sort(function(a,b){return b.depart.localeCompare(a.depart)})}
function departHtml(d){
  if(parti(d))return '<div class="alert" style="flex-wrap:wrap"><div class="x"><b>Parti de l\'écurie le '+fdl(d.depart)+'</b>'+(d.departMotif?'<br>Motif : '+esc(d.departMotif):'')+(d.departDest?'<br>Destination : '+esc(d.departDest):'')+'</div><button type="button" class="btn sm" data-act="retour">Le cheval est revenu</button></div>';
  return '<details class="panel" style="padding:12px 14px"'+(d.depart?' open':'')+'><summary style="cursor:pointer;font-weight:600">Le cheval quitte l\'écurie'+(d.depart?' (prévu le '+fdate(d.depart,{day:'numeric',month:'long'})+')':'')+'</summary><div class="form" style="margin-top:10px"><div class="grid2">'+fld('h-dep','Date de départ',d.depart||'','date')+sel('h-motif','Motif',[['','— Choisir —']].concat(MOTIFS_DEPART.map(function(m){return[m,m]})),d.departMotif||'')+'</div>'+
    fld('h-dest','Destination ou précision (facultatif)',d.departDest||'','text',' placeholder="ex. vendu à M. Durand, Écurie du Moulin"')+
    '<button type="button" class="btn danger" data-act="depart">Enregistrer le départ</button><p class="sub" style="margin:0">Le cheval sort des listes et reste dans le registre d\'élevage avec sa date et son motif de sortie. Une date à venir enregistre un départ prévu.</p></div></details>';
}

/* ---------- silo à grain ---------- */
function grain(id){return (db.grains||[]).find(function(g){return g.id===id})}
function litres(n){return String(r2(n)).replace('.',',')+' L'}
function grainLignes(c){return (c.grains||[]).filter(function(x){return grain(x.grainId)})}
function grainJour(x){return (+x.matin||0)+(+x.midi||0)+(+x.soir||0)}
function grainTexte(c){return grainLignes(c).map(function(x){var r=[];['matin','midi','soir'].forEach(function(k){if(+x[k])r.push(k+' '+litres(x[k]))});return grain(x.grainId).nom+' : '+(r.join(', ')||'—')}).join('\n')}
function grainConso(g){var j=0,n=0;actifs().forEach(function(c){var l=(c.grains||[]).filter(function(x){return x.grainId===g.id});if(l.length){n++;l.forEach(function(x){j+=grainJour(x)})}});return{jour:j,chevaux:n,jours:+g.stock>0&&j>0?Math.floor(g.stock/j):null}}
function vSilo(){
  var gs=db.grains||[];
  var h='<section><div class="sh"><h2>Mes grains</h2><span class="sub">'+gs.length+' grain'+(gs.length>1?'s':'')+'</span></div><div class="panel items">'+(gs.length?gs.map(function(g){var k=grainConso(g);
    return '<div class="item" style="cursor:default;flex-wrap:wrap"><span class="x" style="flex:1 1 200px"><b>'+esc(g.nom)+'</b><span>'+k.chevaux+' cheva'+(k.chevaux>1?'ux':'l')+' · '+litres(k.jour)+' par jour'+(+g.stock>0?' · stock '+litres(g.stock)+(k.jours!==null?' · environ '+k.jours+' jour'+(k.jours>1?'s':''):''):'')+'</span>'+(g.note?'<span class="sub" style="display:block">'+esc(g.note)+'</span>':'')+'</span><span class="end" style="display:flex;gap:6px;align-items:center">'+(k.jours!==null&&k.jours<=7?'<span class="pill late">À commander</span>':'')+'<button class="btn sm" data-act="grain-edit" data-id="'+g.id+'">Modifier</button></span></div>'}).join(''):'<div class="empty">Aucun grain. Ajoutez les aliments de votre silo : granulés, orge, floconné, luzerne…</div>')+'</div>'+
    '<form class="panel form" id="fgrain" style="padding:14px"><span class="lbl">Ajouter un grain</span><div class="grid2">'+fld('gr-nom','Nom','','text',' placeholder="ex. Granulés sport" required')+fld('gr-stock','Stock en litres (facultatif)','','number',' min="0" step="1" inputmode="decimal"')+'</div>'+fld('gr-note','Note (facultatif)','','text',' placeholder="ex. fournisseur, marque"')+'<button class="btn primary" type="submit">Ajouter au silo</button></form></section>';
  return h+'<p class="sub" style="margin:0">Dans la fiche de chaque cheval, choisissez le grain et sa quantité en litres pour le matin, le midi et le soir. Le silo calcule la consommation par jour et l\'autonomie du stock.</p>';
}
function grainModal(id){
  var g=grain(id);if(!g)return;
  M={kind:'grain',draft:clean(g),read:function(){},render:function(){var d=M.draft,k=grainConso(d);
    mb(head(d.nom)+'<form class="form" id="fgrainedit">'+fld('ge-nom','Nom',d.nom,'text',' required')+'<div class="grid2">'+fld('ge-stock','Stock en litres',d.stock||'','number',' min="0" step="1" inputmode="decimal"')+'<div class="field"><span class="lbl">Consommation</span><div style="min-height:44px;display:flex;align-items:center">'+litres(k.jour)+' par jour · '+k.chevaux+' cheva'+(k.chevaux>1?'ux':'l')+'</div></div></div>'+fld('ge-note','Note',d.note||'')+
      '<button class="btn primary block" type="submit">Enregistrer</button>'+(M.confirmDel?'<div class="actions"><button type="button" class="btn danger grow" data-act="grain-del" data-id="'+d.id+'">Confirmer la suppression</button><button type="button" class="btn" data-act="grain-del-no">Annuler</button></div>':'<button type="button" class="btn danger" data-act="grain-del-ask">Supprimer ce grain</button>')+'</form>')}};
  openModal();
}
var QTES=(function(){var l=[];for(var x=0.25;x<=4.001;x+=0.25)l.push(r2(x));[4.5,5,5.5,6,7,8].forEach(function(x){l.push(x)});return l})();
function qteSel(name,val,lab){var v0=val===''||val==null?'':+val,opts=QTES.slice();if(v0!==''&&opts.indexOf(v0)<0){opts.push(v0);opts.sort(function(a,b){return a-b})}
  return '<select class="search" name="'+name+'" aria-label="'+lab+'"><option value="">—</option>'+opts.map(function(q){return '<option value="'+q+'"'+(q===v0?' selected':'')+'>'+litres(q)+'</option>'}).join('')+'</select>'}
function grainsField(d){
  var gs=db.grains||[];
  var l=(d.grains||[]).length?d.grains:[{grainId:gs.length?'':'__new',matin:'',midi:'',soir:''}];
  return '<div class="field"><span class="lbl">Grain et quantité par repas (en litres)</span><div class="panel items">'+l.map(function(x,i){var neuf=x.grainId==='__new';
    return '<div class="item gline" style="cursor:default;flex-wrap:wrap"><label class="qty" style="flex:1 1 100%"><span>Type de grain</span><select class="search" name="gl-g" aria-label="Type de grain"><option value="">— Choisir —</option>'+gs.map(function(g){return '<option value="'+g.id+'"'+(g.id===x.grainId?' selected':'')+'>'+esc(g.nom)+'</option>'}).join('')+'<option value="__new"'+(neuf?' selected':'')+'>+ Nouveau grain…</option></select></label>'+
      (neuf?'<label class="qty" style="flex:1 1 100%"><span>Nom du nouveau grain (ajouté au silo)</span><input class="search" name="gl-new" value="'+esc(x.nouveau||'')+'" placeholder="ex. Granulés sport, orge aplatie" aria-label="Nom du nouveau grain"></label>':'')+
      ['matin','midi','soir'].map(function(r){return '<label class="qty"><span>'+r.charAt(0).toUpperCase()+r.slice(1)+'</span>'+qteSel('gl-'+r,x[r],'Quantité le '+r)+'</label>'}).join('')+
      '<button type="button" class="del-x" data-act="gl-del" data-id="'+i+'" aria-label="Retirer ce grain" style="align-self:flex-end">✕</button></div>'}).join('')+
    '<div class="item" style="cursor:default"><button type="button" class="btn sm" data-act="gl-add">+ Ajouter un autre grain</button></div></div></div>';
}
/* Fiche d'un cheval déjà enregistré : le grain est enregistré dès qu'on le change, sans attendre « Enregistrer ». */
function saveGrainsNow(){if(!M||M.kind!=='chevaux')return;var l=readGrains();M.draft.grains=l;if(!M.draft.id)return;var c=horse(M.draft.id);if(!c)return;
  var ok=l.filter(function(x){return x.grainId&&x.grainId!=='__new'&&(x.matin||x.midi||x.soir)}).map(function(x){return{grainId:x.grainId,matin:x.matin,midi:x.midi,soir:x.soir}});
  if(JSON.stringify(ok)===JSON.stringify(c.grains||[]))return;c.grains=clean(ok);put('chevaux',c);toast('Ration de '+c.nom+' enregistrée')}
function readGrains(){return [].slice.call(document.querySelectorAll('#fhorse .gline')).map(function(r){function q(n){var e=r.querySelector('[name="'+n+'"]');return e?e.value:''}function num(n){var x=parseFloat(String(q(n)).replace(',','.'));return x>0?r2(x):''}
  var o={grainId:q('gl-g'),matin:num('gl-matin'),midi:num('gl-midi'),soir:num('gl-soir')};if(o.grainId==='__new')o.nouveau=q('gl-new');return o})}

/* ---------- registre d'élevage ---------- */
function registreChevaux(){return db.chevaux.slice().sort(function(a,b){return String(a.arrivee||'0000').localeCompare(String(b.arrivee||'0000'))||a.nom.localeCompare(b.nom)})}
function propNom(c){var o=owner(c.proprietaireId);return o?o.nom:(c.proprietaireId?'Propriétaire':(db.ecurie.nom||'L\'écurie'))}
function registreRows(){return [['Nom','N° SIRE / UELN','N° de transpondeur','Sexe','Race','Date de naissance','Propriétaire','Date d\'entrée','Provenance','Date de sortie','Motif de sortie','Destination']].concat(registreChevaux().map(function(c){
  return [c.nom,c.sire||'',c.puce||'',c.sexe||'',c.race||'',dfr(c.naissance),propNom(c),dfr(c.arrivee),c.provenance||'',dfr(c.depart),c.departMotif||'',c.departDest||'']}))}
function soinsRegistre(){var l=[];db.chevaux.forEach(function(c){(c.soins||[]).forEach(function(s){if(s.fait)l.push({c:c,s:s})})});return l.sort(function(a,b){return b.s.date.localeCompare(a.s.date)})}
function soinsRows(){return [['Date','Cheval','N° SIRE','Soin ou traitement','Produit','Précision','Noté par']].concat(soinsRegistre().map(function(x){return [dfr(x.s.date),x.c.nom,x.c.sire||'',x.s.type,x.s.produit||'',x.s.note||'',x.s.par==='client'?'Propriétaire':'Écurie']}))}
function tableHtml(rows,cls){return '<table class="'+(cls||'reg')+'"><thead><tr>'+rows[0].map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.slice(1).map(function(r){return '<tr>'+r.map(function(x){return '<td>'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'}
function vRegistre(){
  var e=db.ecurie,l=registreChevaux(),pr=actifs().length,so=soinsRegistre();
  var h='<p class="sub" style="margin:0">Liste de tous les équidés passés par l\'écurie, avec leurs entrées, sorties et soins, à présenter en cas de contrôle. Les fiches des chevaux le remplissent automatiquement.</p>';
  if(!e.adresse||!e.detenteur)h+='<div class="banner"><div class="x"><b>À compléter</b><br>Adresse et n° de détenteur de l\'écurie (Réglages › Mon écurie) : ils figurent en tête du registre.</div><button class="btn sm primary" data-act="settings">Réglages</button></div>';
  h+='<div class="actions"><button class="btn primary grow" data-act="reg-print">Imprimer ou enregistrer en PDF</button><button class="btn grow" data-act="reg-csv">Exporter les équidés (Excel)</button><button class="btn grow" data-act="reg-soins">Exporter les soins (Excel)</button></div>';
  h+='<div class="kpis"><div class="panel"><b>'+pr+'</b><span>présents</span></div><div class="panel"><b>'+partis().length+'</b><span>sortis</span></div><div class="panel"><b>'+so.length+'</b><span>soins notés</span></div></div>';
  h+='<section><div class="sh"><h2>Équidés</h2><span class="sub">'+l.length+' au total</span></div>'+(l.length?'<div class="panel tscroll">'+tableHtml([['Cheval','Identification','Propriétaire','Entrée','Sortie']].concat(l.map(function(c){
    return [c.nom+(c.sexe||c.race?' · '+[c.sexe,c.race].filter(Boolean).join(', '):''),[c.sire?'SIRE '+c.sire:'',c.puce?'Puce '+c.puce:''].filter(Boolean).join(' · ')||'—',propNom(c),(c.arrivee?dfr(c.arrivee):'—')+(c.provenance?' · '+c.provenance:''),c.depart?(dfr(c.depart)+(c.departMotif?' · '+c.departMotif:'')+(c.departDest?' · '+c.departDest:'')):(parti(c)?'':'présent')]})))+'</div>':'<div class="panel empty">Aucun cheval enregistré.</div>')+'</section>';
  h+='<section><div class="sh"><h2>Soins et traitements</h2><span class="sub">'+so.length+'</span></div>'+(so.length?'<div class="panel tscroll">'+tableHtml([['Date','Cheval','Soin','Précision']].concat(so.slice(0,60).map(function(x){return [dfr(x.s.date),x.c.nom,soinNom(x.s),x.s.note||'']})))+'</div>'+(so.length>60?'<p class="sub" style="margin:0">Les 60 derniers sont affichés ; l\'export et l\'impression contiennent tout.</p>':''):'<div class="panel empty">Aucun soin fait enregistré.</div>')+'</section>';
  return h;
}
function registreDoc(){var e=db.ecurie,r=registreRows(),s=soinsRows();
  return '<h1>Registre d\'élevage</h1><p><b>'+esc(e.nom||'')+'</b>'+(e.adresse?'<br>'+esc(e.adresse).replace(/\n/g,'<br>'):'')+(e.detenteur?'<br>N° de détenteur : '+esc(e.detenteur):'')+(e.siret?'<br>SIRET : '+esc(e.siret):'')+'<br>Édité le '+fdl(today())+'</p>'+
    '<h2>Équidés détenus</h2>'+tableHtml(r,'reg print')+'<h2>Soins et traitements</h2>'+(s.length>1?tableHtml(s,'reg print'):'<p>Aucun soin enregistré.</p>')}
function imprimerRegistre(){var p=document.getElementById('print');p.innerHTML=registreDoc();setTimeout(function(){window.print()},50)}

/* ---------- alertes ---------- */
function alertesHtml(al){
  return al.map(function(a,i){var acts='';
    if(a.type==='soin')acts='<button class="btn sm primary" data-act="alert-fait" data-id="'+a.horse+'|'+a.soin+'">C\'est fait</button><button class="btn sm" data-act="alert-report" data-id="'+a.horse+'|'+a.soin+'">Reporter d\'une semaine</button><button class="btn sm" data-act="horse-soins" data-id="'+a.horse+'">Fiche du cheval</button>';
    else if(a.type==='rc')acts='<button class="btn sm" data-act="owner" data-id="'+a.owner+'">Fiche du cavalier</button>';
    else if(a.type==='signal')acts='<button class="btn sm primary" data-act="signal-ok" data-id="'+a.msg+'">Marquer réglé</button><button class="btn sm" data-act="alert-thread" data-id="'+a.owner+'">Répondre</button>'+(a.horse?'<button class="btn sm" data-act="horse" data-id="'+a.horse+'">Fiche du cheval</button>':'');
    return '<div class="alert '+(a.n<0||a.type==='signal'?'late':'')+'" style="flex-direction:column;align-items:stretch;gap:8px"><div class="x"><b>'+esc(a.title)+'</b><br>'+esc(a.detail)+'</div><div class="actions">'+acts+'</div></div>'}).join('');
}
function alertsModal(){
  M={kind:'alertes',draft:{},read:function(){},focus:false,render:function(){var al=alerts();
    mb(head('Alertes'+(al.length?' ('+al.length+')':''))+(al.length?'<p class="sub" style="margin:0">Soins à faire dans les 14 jours, assurances qui expirent et problèmes signalés par les cavaliers.</p>'+alertesHtml(al):'<div class="panel empty">Aucune alerte. Tout est à jour.</div>'))}};
  openModal();
}

/* ---------- signalements des cavaliers ---------- */
var TYPES_SIGNAL=['Blessure ou boiterie','Ne mange pas ou ne boit pas','Comportement inhabituel','Couverture ou matériel','Box, clôture ou abreuvoir','Autre'];
function signalements(cid){return db.messages.filter(function(m){return m.signal&&!m.regle&&(!cid||m.chevalId===cid)}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))})}
function signalModal(cid){
  var c=horse(cid);if(!c)return;
  M={kind:'signal',draft:{cid:cid},read:function(){},render:function(){
    mb(head('Signaler un problème')+'<form class="form" id="fsignal"><div class="panel" style="padding:12px 14px;display:flex;gap:10px;align-items:center"><span class="avatar '+avc(c.nom)+'">'+esc(initials(c.nom))+'</span><div><b>'+esc(c.nom)+'</b><div class="sub">'+esc(c.box||'')+'</div></div></div>'+
      sel('sg-type','Problème',TYPES_SIGNAL.map(function(t){return[t,t]}),TYPES_SIGNAL[0])+'<div class="field"><label for="sg-texte">Ce que vous avez constaté</label><textarea id="sg-texte" required placeholder="ex. boite de l\'antérieur droit au pas, chaleur au boulet"></textarea></div>'+
      '<p class="sub" style="margin:0">Le gérant reçoit une notification tout de suite et vous répond dans Messages.</p><button class="btn primary block" type="submit">Envoyer le signalement</button></form>')}};
  openModal();
}
function envoyerSignal(){
  var c=horse(M.draft.cid),ty=v('sg-type'),tx=v('sg-texte');if(!c)return;if(!tx){toast('Décrivez le problème.');return}
  var m={id:uid(),proprietaireId:me.prop,de:'client',texte:'Signalement · '+ty+' : '+tx,lu:false,date:new Date().toISOString(),chevalId:c.id,signal:true,typeSignal:ty};
  db.messages.push(m);put('messages',m);
  notifier({type:'gerant'},'Problème signalé : '+c.nom,((owner(me.prop)||{}).nom||'Un cavalier')+' · '+ty+' · '+tx.slice(0,100),'jour');
  closeModal();render();toast('Signalement envoyé au gérant');

  if(id==='freglages'){db.annulHeures=Math.max(0,+v('t-annul')||0);var li=v('t-lieux').split('\n').map(function(x){return x.trim()}).filter(Boolean);db.lieux=li.length?li:LIEUX_DEF.slice();putConfig();toast('Réglages enregistrés');render();return}
  if(!M)return;M.read();var d=M.draft;

      var g=(db.grains||[]).find(function(y){return y.nom.toLowerCase()===n.toLowerCase()});if(!g){g={id:'g-'+uid(),nom:n,stock:'',note:''};db.grains=(db.grains||[]).concat([g]);ajout.push(n)}x.grainId=g.id});
    if(ajout.length){putConfig();setTimeout(function(){toast('Ajouté au silo : '+ajout.join(', '))},1500)}
